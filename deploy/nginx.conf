# Nginx config for Exercises Browser
#
# 1. Clone repo on your server:
#      git clone https://github.com/ChinmayaGit/exercises.git /var/www/exercises
#
# 2. Copy this file:
#      sudo cp deploy/nginx.conf /etc/nginx/sites-available/exercises
#
# 3. Enable site:
#      sudo ln -s /etc/nginx/sites-available/exercises /etc/nginx/sites-enabled/
#      sudo nginx -t
#      sudo systemctl reload nginx
#
# 4. Open http://YOUR_SERVER_IP in a browser

server {
    listen 80;
    # Change to your domain or server IP
    server_name _;

    # Path where you cloned the repo
    root /var/www/exercises;
    index index.html;

    # Main app + JSON + GIFs
    location / {
        try_files $uri $uri/ =404;
    }

    # JSON dataset
    location /data/ {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # GIFs — cache for faster repeat visits
    location /gifs/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Optional: gzip for JSON (GIFs are already compressed)
    gzip on;
    gzip_types application/json text/html text/css application/javascript;
}
