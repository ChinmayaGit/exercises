# Nginx config for Exercises Browser (static site)
#
# Deploy on Linux:
#   sudo git clone https://github.com/ChinmayaGit/exercises.git /var/www/exercises
#   sudo cp /var/www/exercises/deploy/nginx.conf /etc/nginx/sites-available/exercises
#   sudo ln -sf /etc/nginx/sites-available/exercises /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then open: http://YOUR_SERVER_IP

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Use your domain here when you have one, e.g. exercises.example.com
    server_name _;

    root /var/www/exercises;
    index index.html;

    # Do not serve git / scripts / hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /scripts/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /deploy/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /data/ {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location /gifs/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/html text/plain text/css application/javascript;

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
}
